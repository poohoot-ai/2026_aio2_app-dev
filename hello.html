<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이름 입력</title>

  <style>
    .container {
      margin: 50px;
      font-size: 20px;
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    label {
      width: 60px;
    }

    input {
      width: 220px;
      height: 35px;
      font-size: 18px;
    }

    button {
      width: 100px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
    }

    .result {
      margin-top: 50px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 이름 입력 영역 -->
    <div class="input-area">
      <label for="name">이름</label>

      <input
        type="text"
        id="name"
        placeholder="이름을 입력하세요"
      >

      <button type="button" onclick="showName()">
        입력
      </button>
    </div>

    <!-- 결과 출력 영역 -->
    <div class="result">
      당신의 이름은
      <span id="result">____</span>
      입니다.
    </div>

  </div>

  <script>
    function showName() {
      const name = document.getElementById("name").value;
      const result = document.getElementById("result");

      if (name.trim() === "") {
        result.textContent = "____";
        alert("이름을 입력해주세요.");
        return;
      }

      result.textContent = name;
    }
  </script>

</body>
</html>
