<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>도서 목록</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
        }

        button {
            padding: 10px 18px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        thead {
            background-color: #2563eb;
            color: white;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .empty {
            color: #888;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📚 도서 목록</h1>

    <button id="loadBtn">목록 불러오기</button>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>도서명</th>
            <th>저자</th>
            <th>출판년도</th>
        </tr>
        </thead>

        <tbody id="result">
        <tr>
            <td colspan="4" class="empty">
                목록 불러오기 버튼을 눌러주세요.
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    document.getElementById("loadBtn").addEventListener("click", async () => {

        const response = await fetch("/books");
        const books = await response.json();

        const tbody = document.getElementById("result");

        tbody.innerHTML = "";

        for (const b of books) {
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${b.id}</td>
                <td>${b.title}</td>
                <td>${b.author}</td>
                <td>${b.year}</td>
            `;

            tbody.appendChild(tr);
        }

        if (books.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="empty">
                        등록된 도서가 없습니다.
                    </td>
                </tr>
            `;
        }
    });
</script>

</body>
</html>
