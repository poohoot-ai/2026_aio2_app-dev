<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>서버 상태</title></head>
<body>
  <h1>서버 상태</h1>
  <p id="status">확인 중...</p>
  <p id="info"></p>


  <script>
    async function load() {
      const health_res = await (await fetch("/health")).json();
      const info_res = await (await fetch("/info")).json();
      document.getElementById("status").textContent = "상태: " + health_res.status;
      document.getElementById("info").textContent = info_res.name + " v" + info_res.version;
    }
    load();
  </script>
</body>
</html>
